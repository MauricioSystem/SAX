[build]
  command = "npm run build"
  publish = "dist"

# Rutas nuevas → redirección 301 desde URLs antiguas
[[redirects]]
  from = "/quienes-somos"
  to = "/information"
  status = 301

[[redirects]]
  from = "/contactenos"
  to = "/legal-information"
  status = 301

[[redirects]]
  from = "/productos"
  to = "/products"
  status = 301

# SPA: el resto sirve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers para mejorar SEO y seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers específicos para archivos estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para sitemap y robots.txt
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
